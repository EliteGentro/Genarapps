# Runs the same checks and build as the deploy on every pull request, then
# deploys a temporary preview channel and links it in a PR comment.
# Pull requests from forks get the checks but no preview (no access to secrets).
name: Checks and preview on PR
on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

# A new push to the same PR cancels the older run.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build_and_preview:
    name: Check, build and preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck, lint and test
        run: npm run check
      - name: Build
        run: npm run build
      - if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GENARAPPS_CE63A }}
          projectId: genarapps-ce63a
